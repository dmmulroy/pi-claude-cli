name: CI
on:
  push:
    branches: [main, "port/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly canary against pi@latest — pi's API surface has broken this
    # extension twice (package rescope, api-registry split). Catch it early.
    - cron: "17 6 * * 1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run test:coverage

  e2e-stub:
    # Full pipeline through a real pi binary with the deterministic Claude
    # CLI stub (tests/e2e/claude-stub.cjs) — no credentials needed.
    strategy:
      fail-fast: false
      matrix:
        # 0.84.2 is the oldest pi this provider is checked against, 1.2.0 the
        # release the devDependencies pin, and `latest` is a required check:
        # a pi release that breaks the provider fails CI.
        pi-version: ["0.84.2", "1.2.0", "latest"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm ci
      - run: npm install -g "@earendil-works/pi-coding-agent@${{ matrix.pi-version }}"
      - run: npm run test:e2e
      # The gate for the Effect services: every stub scenario's trace assertions.
      - run: npm run test:scenarios
